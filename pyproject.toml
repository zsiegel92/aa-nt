[project]
name = "aa-to-nt-app"
version = "0.1.0"
description = "AA-to-NT codon design app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "modal>=1.3.0.post1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pydantic-settings>=2.11.0",
    "pydantic>=2.12.3",
    "pyright>=1.1.407",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.3.2.250926",
    "pytest>=9.0.1",
    "ruff>=0.14.0",
    "uvicorn>=0.37.0",
]

[tool.pyright]
include = ["aa_to_nt_backend", "tests/backend", "server.py", "dump_openapi.py","scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"aa_to_nt_backend/models.py" = ["E741"]

[tool.ruff.format]
quote-style = "double"
